AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Secrets Manager Secrets for Stock Exchange

Parameters:
  EnvironmentName:
    Description: Name of the environment (e.g., dev, staging, prod)
    Type: String
  # It's better practice to generate and manage these securely outside CFN,
  # but for demonstration, we include them as parameters here.
  # In a real-world scenario, consider using a custom resource or external process
  # to populate the secret initially without passing sensitive data via CFN parameters.
  DatabaseMasterUsername:
    Description: Master username for the database secret
    Type: String
    NoEcho: true
  DatabaseMasterUserPassword:
    Description: Master password for the database secret
    Type: String
    NoEcho: true

Resources:
  # Secrets Manager secret for RDS credentials
  RDSClusterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/rds/stock-exchange/credentials" # Standard naming convention
      Description: RDS master user credentials for the stock exchange database
      # Generating SecretString based on parameters - NOT RECOMMENDED for production deployment via CFN parameters
      # Consider using GeneratedPassword if you want Secrets Manager to create the password
      SecretString: !Sub '{"username":"${DatabaseMasterUsername}","password":"${DatabaseMasterUserPassword}"}'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: RDS

Outputs:
  RDSClusterSecretArn:
    Description: The ARN of the RDS credentials secret
    Value: !Ref RDSClusterSecret
    Export:
      Name: !Sub "${EnvironmentName}-RDSClusterSecretArn"
