name: CI with LocalStack

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: sqs,cloudformation,rds
          DEBUG: 1
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker-in-Docker (optional)
        run: sudo service docker start

      - name: Wait for LocalStack to be healthy
        run: |
          echo "Waiting for LocalStack to become healthy..."
          for i in {1..10}; do
            STATUS=$(curl -s http://localhost:4566/_localstack/health | jq -r '.services | to_entries[] | select(.value != "running")')
            if [ -z "$STATUS" ]; then
              echo "✅ All LocalStack services are healthy"
              break
            fi
            echo "⏳ Services still starting: $STATUS"
            sleep 5
          done

      - name: Check AWS CLI version
        run: aws --version

      - name: Set AWS credentials for LocalStack
        run: |
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_DEFAULT_REGION=us-east-1

      - name: Deploy infrastructure via CloudFormation
        run: |
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_DEFAULT_REGION=us-east-1
          bash scripts/deploy.sh

      - name: Verify SQS queue exists
        run: |
          aws sqs list-queues --endpoint-url=http://localhost:4566

      - name: Verify RDS instance creation (mock)
        run: |
          aws rds describe-db-instances --endpoint-url=http://localhost:4566 || echo "Expected in mock mode"

