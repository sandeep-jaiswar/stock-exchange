services:
  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,cloudformation,sts,s3,lambda
      DEBUG: 1
    volumes:
      - ./infra/localstack-init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    ports:
      - "5432:5432"

  gateway:
    build: ./apps/gateway
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      - postgres
      - localstack
    ports:
      - "8080:8080"

  marketdata:
    build: ./apps/marketdata
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      - postgres
      - localstack
    ports:
      - "8081:8081"

  backoffice-client:
    build: ./apps/backoffice-client
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  localstack_data:
