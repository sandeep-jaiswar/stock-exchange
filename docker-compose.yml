version: '3.8'

services:
  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,cloudformation,sts,s3,lambda
      DEBUG: 1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    volumes:
      - ./infra/localstack-init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"

  gateway:
    build: ./apps/gateway
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_SQS_ENDPOINT: http://localstack:4566
      AWS_CLOUDFORMATION_ENDPOINT: http://localstack:4566
      AWS_RDS_ENDPOINT: http://localstack:4566
    depends_on:
      - postgres
      - localstack
    ports:
      - "8080:8080"

  marketdata:
    build: ./apps/marketdata
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_SQS_ENDPOINT: http://localstack:4566
      AWS_CLOUDFORMATION_ENDPOINT: http://localstack:4566
      AWS_RDS_ENDPOINT: http://localstack:4566
    depends_on:
      - postgres
      - localstack
    ports:
      - "8081:8081"

  backoffice-client:
    build: ./apps/backoffice-client
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  localstack_data:
